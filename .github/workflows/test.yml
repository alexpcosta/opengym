# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/build-coach-library.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # The diet diary's food table is generated from the TACO data and the Spanish names
      # committed next to it; an edit to either that forgets to regenerate fails here.
      - run: node scripts/build-taco.mjs --check
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No dependencies to install: the Coach tests run on node:test and drive the in-repo
      # fixture provider, so the whole job graph works without an AI account or a network.
      - run: npm test
        working-directory: api
      # The API's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-library.mjs --check

  # Building the api image is the only place that proves the bundled Claude CLI actually
  # installs and starts on alpine — the Dockerfile runs `claude --version` as a build step.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
